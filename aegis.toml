# Aegis configuration.
#
# Secrets do not go in this file. Each provider names the environment variable
# that holds its key (api_key_env); a provider whose variable is unset is
# skipped by the router and shown as "not set" in the dashboard.
#
# Model ids, prices and free-tier limits change. Check them against each
# provider's current documentation before relying on the cost figures.

[server]
bind = "0.0.0.0:8787"
db_path = "data/aegis.db"
retention_days = 30

[auth]
required = true

[cache]
enabled = true
ttl_secs = 3600
max_entries = 10000
# Only requests with temperature <= this (or a seed) are cached, so sampled
# requests keep varying. Override per request with `x-aegis-cache: force|bypass`.
max_temperature = 0.0
cache_when_temperature_unset = false
scope = "per_key"   # or "global" to share entries between client keys

# Semantic matching: also serve a stored answer when the last user message
# means the same as an earlier one (everything else in the request must be
# identical). It is a similarity score, not a guarantee, so it is off by
# default. Responses served this way carry `x-aegis-cache: semantic`; a client
# can opt out per request with `x-aegis-cache: exact`.
[cache.semantic]
enabled = false
embedding_model = "ollama/nomic-embed-text"   # needs the "embeddings" capability
threshold = 0.95      # minimum cosine similarity; lower matches more loosely
max_entries = 2000
min_chars = 16        # shorter messages are matched exactly only
timeout_ms = 3000     # give up on the embedding call and go upstream
# The model is warmed once at startup. Set this above 0 to also ping it this
# often, for servers that unload an idle model (Ollama: after 5 minutes).
keep_warm_secs = 0

# Alerts are always listed on the dashboard's Alerts page. To also receive
# them, put a webhook URL (Slack, Discord or anything that accepts a JSON
# POST) in the environment variable named here.
[alerts]
webhook_url_env = "AEGIS_ALERT_WEBHOOK"
budget_warn_at = 0.8      # warn at 80% of a key's daily budget, and again at 100%
cooldowns = true          # alert when a model starts cooling down
min_interval_secs = 300   # do not repeat the same alert more often than this

# ---- providers -------------------------------------------------------------

[[providers]]
name = "ollama"
kind = "openai"
base_url = "http://127.0.0.1:11434/v1"
tier = "local"
timeout_secs = 300

  [[providers.models]]
  id = "qwen2.5:7b"
  context_window = 32768
  capabilities = ["tools", "json"]

  [[providers.models]]
  id = "qwen2.5-coder:3b"
  context_window = 32768
  capabilities = ["json"]

  # Embedding model: `ollama pull nomic-embed-text` before using it.
  [[providers.models]]
  id = "nomic-embed-text"
  context_window = 8192
  capabilities = ["embeddings"]

[[providers]]
name = "groq"
kind = "openai"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
tier = "free"

  [[providers.models]]
  id = "llama-3.1-8b-instant"
  context_window = 131072
  capabilities = ["tools", "json"]
  limits = { rpm = 30, rpd = 14400, tpm = 6000, tpd = 500000 }

  [[providers.models]]
  id = "llama-3.3-70b-versatile"
  context_window = 131072
  capabilities = ["tools", "json"]
  limits = { rpm = 30, rpd = 1000, tpm = 12000, tpd = 100000 }

[[providers]]
name = "gemini"
kind = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta"
api_key_env = "GEMINI_API_KEY"
tier = "free"

  [[providers.models]]
  id = "gemini-2.5-flash"
  context_window = 1048576
  capabilities = ["tools", "vision", "json"]
  limits = { rpm = 10, rpd = 250, tpm = 250000 }

[[providers]]
name = "anthropic"
kind = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
tier = "paid"
timeout_secs = 600

  [[providers.models]]
  id = "claude-haiku-5-5"
  context_window = 1000000
  max_output = 64000
  capabilities = ["tools", "vision"]
  input_per_mtok = 0.10
  output_per_mtok = 0.50

  [[providers.models]]
  id = "claude-sonnet-5-5"
  context_window = 1000000
  max_output = 64000
  capabilities = ["tools", "vision"]
  input_per_mtok = 2.00
  output_per_mtok = 10.00

  [[providers.models]]
  id = "claude-opus-5-5"
  context_window = 1000000
  max_output = 64000
  capabilities = ["tools", "vision"]
  input_per_mtok = 4.00
  output_per_mtok = 20.00

[[providers]]
name = "openai"
kind = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
tier = "paid"

  [[providers.models]]
  id = "gpt-4o-mini"
  context_window = 128000
  capabilities = ["tools", "vision", "json"]
  input_per_mtok = 0.15
  output_per_mtok = 0.60

  [[providers.models]]
  id = "text-embedding-3-small"
  context_window = 8191
  capabilities = ["embeddings"]
  input_per_mtok = 0.02

# ---- routes ----------------------------------------------------------------
# Targets are tried in order. One is skipped when its key is unset, it lacks a
# capability the request needs, the request exceeds its context window, its
# quota is used up, or it is cooling down after errors. Paid targets are only
# used for client keys that allow it.

[[routes]]
alias = "fast-model"
description = "Cheapest quick answer: free tier, then local, then paid"
targets = ["groq/llama-3.1-8b-instant", "ollama/qwen2.5:7b", "anthropic/claude-haiku-5-5"]

[[routes]]
alias = "smart-model"
description = "Best quality available, free first"
targets = ["groq/llama-3.3-70b-versatile", "gemini/gemini-2.5-flash", "anthropic/claude-sonnet-5-5"]

[[routes]]
alias = "local-model"
description = "Never leaves this machine"
targets = ["ollama/qwen2.5:7b", "ollama/qwen2.5-coder:3b"]

[[routes]]
alias = "vision-model"
description = "Image input"
targets = ["gemini/gemini-2.5-flash", "anthropic/claude-haiku-5-5", "openai/gpt-4o-mini"]

# Embeddings (POST /v1/embeddings). Vectors from different models cannot be
# compared, so a route only falls back between targets with the same model id.
[[routes]]
alias = "embed-model"
description = "Text embeddings"
targets = ["ollama/nomic-embed-text"]
